<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoGrowth - 專注力電子雞</title>
    <style>
        /* 🌟 新增：讓 CSS 知道 --progress 是一個可以做動畫的百分比 🌟 */
        @property --progress {
            syntax: '<percentage>';
            inherits: false;
            initial-value: 0%;
        }

        /* 基礎重置與背景設定 */
        body {
            background-color: #2b3a4a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 外層：負責黃色發光邊框與立體陰影 */
        .container-wrapper {
            background: conic-gradient(#88c0d0 var(--progress, 0%), transparent 0%);
            padding: 4px; 
            border-radius: 36px; 
            box-shadow: 15px 15px 30px #1a232c, 
                       -15px -15px 30px #3c5168;
            width: 350px;
            /* 🌟 關鍵：加上 1 秒的平滑線性動畫 🌟 */
            transition: --progress 1s linear; 
        }

        /* 主容器 */
        .container {
            text-align: center;
            background: #2b3a4a;
            padding: 40px 46px; 
            border-radius: 36px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #a3c2c2;
            margin-bottom: 30px;
        }

        /* 等級與經驗值系統 */
        .level-container {
            text-align: left;
            margin-bottom: 20px;
        }

        #level-text {
            font-size: 0.85rem;
            color: #88c0d0;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .progress-bar-bg {
            background: #1e2936;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            box-shadow: inset 3px 3px 6px #151d26, 
                        inset -3px -3px 6px #273546;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: #88c0d0;
            height: 100%;
            width: 0%; 
            border-radius: 10px;
            transition: width 0.5s ease-out; 
            box-shadow: 0 0 8px rgba(136, 192, 208, 0.6); 
        }

        /* 寵物展示區 */
        .pet-container {
            margin: 20px 0;
            min-height: 150px;
        }

        #pet {
            font-size: 6rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .pet-focus {
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #pet-status {
            font-size: 0.9rem;
            color: #8fa6b8;
            margin-top: 10px;
        }

        /* 計時器顯示 */
        #time-display {
            font-size: 4.5rem;
            font-weight: bold;
            color: #88c0d0;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        /* 按鈕設計 */
        .controls {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }

        button {
            background: #2b3a4a;
            color: #e0e0e0;
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 8px 8px 16px #1a232c, 
                       -8px -8px 16px #3c5168;
            transition: all 0.2s ease;
        }

        button:active {
            box-shadow: inset 8px 8px 16px #1a232c, 
                       inset -8px -8px 16px #3c5168;
            color: #88c0d0;
        }
    </style>
</head>
<body>

    <div class="container-wrapper" id="progress-wrapper">
        <div class="container">
            <h1>🌱 PomoGrowth</h1>
            
            <div class="level-container">
                <div id="level-text">Pomo-chan's Focus Level: 1 (0/100 XP)</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="xp-bar"></div>
                </div>
            </div>

            <div class="pet-container">
                <div id="pet">🥚</div> 
                <p id="pet-status">等待專注中...</p>
            </div>

            <div id="time-display">00:10</div>

            <div class="controls">
                <button id="start-btn">開始專注</button>
                <button id="reset-btn">重置</button>
            </div>
        </div>
    </div> 

    <script>
        let timer;
        let timeLeft = 10; 
        let isRunning = false;
        let isFocusMode = true; 

        let level = 1;
        let currentXP = 0;
        const xpRewardPerSession = 25; 

        function getXpNeeded(currentLevel) {
            return 100 + (currentLevel - 1) * 50; 
        }

        const timeDisplay = document.getElementById('time-display');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const pet = document.getElementById('pet');
        const petStatus = document.getElementById('pet-status');
        const levelText = document.getElementById('level-text');
        const xpBar = document.getElementById('xp-bar');
        const progressWrapper = document.getElementById('progress-wrapper'); 

        // 🌟 修改：讓進度條瞬間回到滿血 (100%)
        function resetProgressBarInstantly() {
            if (progressWrapper) {
                progressWrapper.style.transition = 'none'; 
                progressWrapper.style.setProperty('--progress', `100%`); // 從 0% 改成 100%
                
                setTimeout(() => {
                    progressWrapper.style.transition = '--progress 1s linear';
                }, 50);
            }
        }

        function updateLevelDisplay() {
            const neededXP = getXpNeeded(level); 
            levelText.textContent = `Pomo-chan's Focus Level: ${level} (${currentXP}/${neededXP} XP)`;
            const progressPercent = (currentXP / neededXP) * 100;
            xpBar.style.width = `${progressPercent}%`;
        }

        function gainXP(amount) {
            currentXP += amount;
            while (currentXP >= getXpNeeded(level)) {
                currentXP -= getXpNeeded(level); 
                level++; 
            }
            updateLevelDisplay();
        }

        function updateDisplay() {
            const safeTime = Math.max(0, timeLeft);
            const minutes = Math.floor(safeTime / 60);
            const seconds = safeTime % 60;
            timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timer);
                isRunning = false;
                startBtn.textContent = '繼續';
                pet.classList.remove('pet-focus');
                petStatus.textContent = '計時已暫停';
                
                // 暫停時把邊框動畫停住
                if (progressWrapper) progressWrapper.style.transition = 'none';
            } else {
                isRunning = true;
                startBtn.textContent = '暫停';
                
                // 恢復時把動畫開回來
                if (progressWrapper) progressWrapper.style.transition = '--progress 1s linear';

                if (isFocusMode) {
                    pet.textContent = '📚'; 
                    pet.classList.add('pet-focus'); 
                    petStatus.textContent = '小怪獸陪你一起專注中！';
                } else {
                    pet.textContent = '💤'; 
                    pet.classList.remove('pet-focus');
                    petStatus.textContent = '休息中...';
                }

                timer = setInterval(() => {
                    if (timeLeft <= 0) {
                        isFocusMode = !isFocusMode; 
                        
                        if (isFocusMode) {
                            timeLeft = 10; 
                            pet.textContent = '📚';
                            pet.classList.add('pet-focus');
                            petStatus.textContent = '休息結束，自動開始專注！';
                        } else {
                            gainXP(xpRewardPerSession); 
                            timeLeft = 5; 
                            pet.textContent = '💤';
                            pet.classList.remove('pet-focus');
                            petStatus.textContent = '太棒了！獲得 25 XP，眼睛休息一下吧。';
                        }
                        // 🌟 切換模式時瞬間歸零進度條 🌟
                        resetProgressBarInstantly(); 
                    } else {
                        timeLeft--;
                    }

                    updateDisplay();

                    // 🌟 修改：倒數計時的公式與條件
                    if (progressWrapper && timeLeft >= 0) { // 把 timeLeft > 0 改成 >= 0 確保最後一秒有執行
                        const totalTime = isFocusMode ? 10 : 5; 
                        // 公式改成直接用 timeLeft 除以總時間，就會變成倒退縮小
                        const percent = (timeLeft / totalTime) * 100;
                        progressWrapper.style.setProperty('--progress', `${percent}%`);
                    }                  
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timer); 
            isRunning = false;    
            isFocusMode = true;   
            timeLeft = 10;        
            updateDisplay();      
            
            // 🌟 重置時瞬間歸零進度條 🌟
            resetProgressBarInstantly();
            
            startBtn.textContent = '開始專注'; 
            pet.textContent = '🥚';
            pet.classList.remove('pet-focus');
            petStatus.textContent = '等待專注中...';
        }

        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
        updateLevelDisplay();
        // 🌟 新增這行：網頁剛載入時，把進度條設為滿的
        if (progressWrapper) progressWrapper.style.setProperty('--progress', `100%`);
    </script>
</body>
</html>
