<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoGrowth - 專注力電子雞</title>
    <style>
        /* 基礎重置與背景設定 (深色新擬態風格) */
        body {
            background-color: #2b3a4a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 主容器 */
        .container {
            text-align: center;
            background: #2b3a4a;
            padding: 40px 50px;
            border-radius: 30px;
            /* 新擬態陰影：一個亮面，一個暗面 */
            box-shadow: 15px 15px 30px #1a232c, 
                       -15px -15px 30px #3c5168;
            width: 350px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #a3c2c2;
            margin-bottom: 30px;
        }

        /* ----- 新增：等級與經驗值系統 ----- */
        .level-container {
            text-align: left;
            margin-bottom: 20px;
        }

        #level-text {
            font-size: 0.85rem;
            color: #88c0d0;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .progress-bar-bg {
            background: #1e2936; /* 較深的背景 */
            border-radius: 10px;
            height: 10px;
            width: 100%;
            /* 內陰影營造凹槽感 */
            box-shadow: inset 3px 3px 6px #151d26, 
                        inset -3px -3px 6px #273546;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: #88c0d0;
            height: 100%;
            width: 0%; /* 透過 JS 動態控制 */
            border-radius: 10px;
            transition: width 0.5s ease-out; /* 進度條動畫 */
            box-shadow: 0 0 8px rgba(136, 192, 208, 0.6); /* 微光暈效果 */
        }
        /* ---------------------------------- */

        /* 寵物展示區 */
        .pet-container {
            margin: 20px 0;
            min-height: 150px;
        }

        #pet {
            font-size: 6rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        /* 寵物專注時的浮動動畫 */
        .pet-focus {
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #pet-status {
            font-size: 0.9rem;
            color: #8fa6b8;
            margin-top: 10px;
        }

        /* 計時器顯示 */
        #time-display {
            font-size: 4.5rem;
            font-weight: bold;
            color: #88c0d0;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        /* 按鈕設計 (新擬態) */
        .controls {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }

        button {
            background: #2b3a4a;
            color: #e0e0e0;
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 8px 8px 16px #1a232c, 
                       -8px -8px 16px #3c5168;
            transition: all 0.2s ease;
        }

        button:active {
            /* 點擊時變成內陰影 */
            box-shadow: inset 8px 8px 16px #1a232c, 
                       inset -8px -8px 16px #3c5168;
            color: #88c0d0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌱 PomoGrowth</h1>
        
        <!-- 新增：等級進度條區塊 -->
        <div class="level-container">
            <div id="level-text">Pomo-chan's Focus Level: 1 (0/100 XP)</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="xp-bar"></div>
            </div>
        </div>

        <div class="pet-container">
            <div id="pet">🥚</div> 
            <p id="pet-status">等待專注中...</p>
        </div>

        <div id="time-display">00:10</div>

        <div class="controls">
            <button id="start-btn">開始專注</button>
            <button id="reset-btn">重置</button>
        </div>
    </div>

    <script>
        // --- 計時器相關變數 ---
        let timer;
        let timeLeft = 10; // 測試用 10 秒 (正式版可改回 25 * 60)
        let isRunning = false;
        let isFocusMode = true; // true = 專注模式, false = 休息模式

        // --- 經驗值相關變數 ---
        let level = 1;
        let currentXP = 0;
        const xpNeededPerLevel = 100; // 每升一級需要的經驗值
        const xpRewardPerSession = 25; // 每次完成「專注」獲得的經驗值

        // 取得 DOM 元素
        const timeDisplay = document.getElementById('time-display');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const pet = document.getElementById('pet');
        const petStatus = document.getElementById('pet-status');
        const levelText = document.getElementById('level-text');
        const xpBar = document.getElementById('xp-bar');
        const progressWrapper = document.getElementById('progress-wrapper'); 

        // 更新經驗值與進度條畫面
        function updateLevelDisplay() {
            levelText.textContent = `Pomo-chan's Focus Level: ${level} (${currentXP}/${xpNeededPerLevel} XP)`;
            const progressPercent = (currentXP / xpNeededPerLevel) * 100;
            xpBar.style.width = `${progressPercent}%`;
        }

        // 獲得經驗值並檢查是否升級
        function gainXP(amount) {
            currentXP += amount;
            
            // 處理升級邏輯
            while (currentXP >= xpNeededPerLevel) {
                currentXP -= xpNeededPerLevel;
                level++;
                console.log(`Level Up! 現在是等級 ${level}`);
            }
            updateLevelDisplay();
        }

        // 更新畫面上的時間
        function updateDisplay() {
            // 加上安全鎖：如果 timeLeft 是負數，強制當作 0 處理
            const safeTime = Math.max(0, timeLeft);
            const minutes = Math.floor(safeTime / 60);
            const seconds = safeTime % 60;
            timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // 開始或暫停計時器
        function toggleTimer() {
            if (isRunning) {
                // 暫停邏輯
                clearInterval(timer);
                isRunning = false;
                startBtn.textContent = '繼續';
                pet.classList.remove('pet-focus');
                petStatus.textContent = '計時已暫停';
            } else {
                // 開始邏輯
                isRunning = true;
                startBtn.textContent = '暫停';

                // 確保每次按下繼續時，寵物狀態是正確的
                if (isFocusMode) {
                    pet.textContent = '📚'; 
                    pet.classList.add('pet-focus'); 
                    petStatus.textContent = '小怪獸陪你一起專注中！';
                } else {
                    pet.textContent = '💤'; 
                    pet.classList.remove('pet-focus');
                    petStatus.textContent = '休息中...';
                }

                // 每秒執行一次
                timer = setInterval(() => {
                    
                    // 1. 先檢查時間是不是已經歸零了
                    if (timeLeft <= 0) {
                        isFocusMode = !isFocusMode; // 反轉狀態
                        
                        if (isFocusMode) {
                            // 自動切換回專注模式
                            timeLeft = 10; 
                            pet.textContent = '📚';
                            pet.classList.add('pet-focus');
                            petStatus.textContent = '休息結束，自動開始專注！';
                        } else {
                            // 自動切換到休息模式
                            gainXP(xpRewardPerSession); // 給經驗值
                            timeLeft = 5; 
                            pet.textContent = '💤';
                            pet.classList.remove('pet-focus');
                            petStatus.textContent = '太棒了！獲得 25 XP，眼睛休息一下吧。';
                        }
                    } else {
                        // 2. 如果時間還沒到，才正常扣一秒
                        timeLeft--;
                    }

                    // 3. 更新畫面 (這時顯示的絕對是安全的正確數字)
                    updateDisplay();

                    // 4. 安全地更新外框進度條 (加上 if 防錯，就算 HTML 沒寫對也不會讓計時器壞掉)
                    if (progressWrapper) {
                        const totalTime = isFocusMode ? 10 : 5; 
                        const percent = ((totalTime - timeLeft) / totalTime) * 100;
                        progressWrapper.style.setProperty('--progress', `${percent}%`);
                    }
                    
                }, 1000);
            }
        }
        // 重置計時器
        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            isFocusMode = true;
            timeLeft = 10; // 測試用 10 秒
            updateDisplay();
            
            progressWrapper.style.setProperty('--progress', `0%`);
            
            startBtn.textContent = '開始專注';
            pet.textContent = '🥚';
            pet.classList.remove('pet-focus');
            petStatus.textContent = '等待專注中...';
        }

        // 綁定按鈕事件
        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        // 初始化顯示
        updateDisplay();
        updateLevelDisplay();
    </script>
</body>
</html>
