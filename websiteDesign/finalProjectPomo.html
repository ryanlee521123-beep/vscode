<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoGrowth - 番茄鐘電子雞</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1e2638;
            --panel-bg: #232c3f;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --accent-cyan: #8be9fd;
            --accent-green: #50fa7b;
            --shadow-dark: #151a27;
            --shadow-light: #2b364d;
        }

        /* 🌟 新增：淺色主題變數 */
        body[data-theme="light"] {
            --bg-color: #e0e5ec;
            --panel-bg: #e0e5ec;
            --text-main: #2d3748;
            --text-dim: #718096;
            --accent-cyan: #0284c7; /* 加深藍色以確保在白底上能看清楚 */
            --accent-green: #059669;
            --shadow-dark: #a3b1c6;
            --shadow-light: #ffffff;
            
            /* 覆蓋原本的深色漸層背景 */
            background: var(--bg-color); 
        }

        body {
            transition: background-color 0.5s ease, color 0.5s ease; /* 讓切換時有柔和漸變 */
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at top right, #33415c 0%, var(--bg-color) 40%, #151b29 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 30px 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.5rem;
            font-weight: 700;
            justify-content: space-between;
        }

        #lang-switch {
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--shadow-light);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        #lang-switch:focus {
            border-color: var(--accent-cyan);
        }
        
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            flex-grow: 1;
            padding: 0 50px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            width: 300px;
        }

        .level-info { margin-bottom: 20px; }
        .level-text {
            font-size: 0.95rem;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        .xp-bar-bg {
            background-color: var(--shadow-dark);
            height: 12px;
            border-radius: 10px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5), inset -2px -2px 5px rgba(255,255,255,0.05);
            overflow: hidden;
        }
        .xp-bar-fill {
            height: 100%;
            width: 0%; 
            background-color: var(--accent-cyan);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.5s ease;
        }

        .character-container {
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* ================= 🌟 新增：貓咪像素動畫系統 ================= */
        /* ================= 🌟 替換：像素貓咪動畫系統 (修復破圖版) ================= */
        .pixel-cat {
            width: 240px;  
            height: 240px;
            background-repeat: no-repeat;
            image-rendering: pixelated; 
            /* 🌟 把原本這裡的 background-size: 100% auto; 刪掉了，移到下方個別設定 */
            filter: drop-shadow(0 0 10px rgba(139, 233, 253, 0.3));
        }

        .cat-idle {
            background-image: url('WhiteCatIdle.png');
            background-size: 100% 600%; /* 🌟 關鍵修復：強制總高度為 6 倍 (6格) */
            animation: play-6-frames 0.6s steps(6) infinite;
        }

        .cat-run {
            background-image: url('WhiteCatRun.png');
            background-size: 100% 600%; /* 🌟 關鍵修復：強制總高度為 6 倍 (6格) */
            animation: play-6-frames 0.25s steps(6) infinite;
            filter: drop-shadow(0 0 15px rgba(80, 250, 123, 0.5)); 
        }

        .cat-die {
            background-image: url('WhiteCatDie.png');
            background-size: 100% 800%; /* 🌟 關鍵修復：Die 這張物理上有 8 格，所以設 800% */
            animation: play-die 0.8s steps(7) forwards;
            filter: drop-shadow(0 0 10px rgba(255, 85, 85, 0.4));
        }

        .cat-revive {
            background-image: url('WhiteCatDie.png');
            background-size: 100% 800%; 
            animation: play-die 0.8s steps(7) reverse forwards;
            filter: drop-shadow(0 0 10px rgba(139, 233, 253, 0.4));
        }

        /* 🌟 移動距離也要對應確保是 240px 的整數倍 */
        @keyframes play-6-frames {
            100% { background-position: 0 -1440px; } /* 240px * 6 = 1440px */
        }

        @keyframes play-die {
            100% { background-position: 0 -1680px; } /* 240px * 7 = 1680px */
        }

        .character-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .mode-selector {
            display: flex;
            gap: 15px;
            background: var(--shadow-dark);
            padding: 8px;
            border-radius: 20px;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4), inset -3px -3px 6px rgba(255,255,255,0.05);
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: var(--panel-bg);
            color: var(--text-main);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .phase-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            margin: 0;
            transition: color 0.3s ease;
        }

        .timer-container {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: var(--bg-color);
            box-shadow: 20px 20px 40px var(--shadow-dark), -20px -20px 40px var(--shadow-light);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg); 
        }
        .progress-ring__circle-bg {
            fill: transparent;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 12;
        }
        .progress-ring__circle {
            fill: transparent;
            stroke: var(--accent-cyan);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 942; 
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        .rest-mode .progress-ring__circle {
            stroke: var(--accent-green);
            filter: drop-shadow(0 0 8px var(--accent-green));
        }
        .rest-mode .time-display, .rest-mode .phase-text {
            color: var(--accent-green);
            text-shadow: 0 0 15px rgba(80, 250, 123, 0.5);
        }

        .time-display {
            font-family: 'VT323', monospace;
            font-size: 6rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(139, 233, 253, 0.5);
            z-index: 2;
            transition: color 0.5s ease;
        }

        .controls {
            display: flex;
            gap: 25px;
            margin-top: 10px;
        }
        .control-btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--panel-bg);
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .control-btn:active {
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            color: var(--accent-cyan);
        }
        .control-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .right-panel {
            width: 280px;
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
        }

        .audio-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .audio-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-color);
            border: none;
            color: var(--text-dim);
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px rgba(255,255,255,0.02);
            transition: all 0.3s ease;
        }
        .audio-btn:hover { color: var(--text-main); }
        .audio-btn.active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan); /* 🌟 改用變數確保淺色下也清楚 */
        }

        /* === 播放器控制項樣式 === */
        .player-controls {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--shadow-light);
            display: none; /* 預設隱藏，播放時顯示 */
            flex-direction: column;
            gap: 15px;
        }
        .now-playing-text {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            font-weight: bold;
            text-align: center;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .slider-group label {
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        /* 自訂滑桿樣式 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            margin-top: -4px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--shadow-dark);
            border-radius: 2px;
        }

        /* ================= 🌟 新增：手機版響應式排版 (RWD) ================= */
        @media (max-width: 950px) {
            body {
                height: auto; /* 解除鎖定 100vh，讓畫面可以根據內容無限往下延伸 */
                min-height: 100vh;
                overflow-y: auto; /* 允許上下滑動 */
                padding-bottom: 40px; /* 底部留點呼吸空間 */
            }

            header {
                padding: 20px;
                flex-direction: column; /* 讓 Logo 和按鈕選單在手機上變成上下排列 */
                gap: 15px;
            }

            .main-layout {
                flex-direction: column; /* 🌟 關鍵：讓左(寵物)、中(計時器)、右(音樂) 改成上下堆疊 */
                padding: 10px 20px;
                gap: 50px;
            }

            .left-panel, .right-panel, .center-panel {
                width: 100%;
                max-width: 320px; /* 確保內容不會超出一般手機螢幕寬度 */
                margin: 0 auto; /* 讓區塊在手機畫面上乖乖置中 */
                box-sizing: border-box; /* 防止 padding 撐破螢幕寬度 */
            }

            .timer-container {
                /* 為了適應較小的手機螢幕 (如 iPhone SE)，把計時器等比例稍微縮小 */
                transform: scale(0.9); 
                margin-top: -15px;
                margin-bottom: -15px;
            }
            
            .character-container {
                height: 250px; /* 手機上寵物區塊可以稍微縮短一點節省空間 */
            }
        }
    </style>
</head>
<body>

    <header style="justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="background: #2b364d; padding: 8px; border-radius: 12px; display: flex;">👾</div>
            <span>PomoGrowth</span>
        </div>
        
        <div style="display: flex; align-items: center; gap: 15px;">
            <button id="theme-switch" onclick="toggleTheme()" style="background:transparent; border:none; font-size:1.2rem; cursor:pointer;">☀️</button>
            
            <select id="lang-switch" onchange="changeLanguage(this.value)">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
            </select>
        </div>
    </header>

    <main class="main-layout">
        
        <section class="left-panel">
            <div class="level-info">
                <div class="level-text" id="level-text">Level: 1 (0/100 XP)</div>
                <div class="xp-bar-bg">
                    <div class="xp-bar-fill" id="xp-bar"></div>
                </div>
            </div>
            
            <div class="character-container">
                <!-- 🌟 替換：改用 div 來繪製像素貓咪動畫 -->
                <div id="pet-sprite" class="pixel-cat cat-idle"></div>
            </div>
        </section>

        <section class="center-panel" id="center-panel">
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="25" onclick="setMode('25', this)" data-i18n="mode25">25 / 5 分鐘</button>
                <button class="mode-btn" data-mode="50" onclick="setMode('50', this)" data-i18n="mode50">50 / 10 分鐘</button>
            </div>

            <p class="phase-text" id="phase-text">專注時間</p>

            <div class="timer-container">
                <svg class="progress-ring" width="320" height="320">
                    <circle class="progress-ring__circle-bg" r="140" cx="160" cy="160"></circle>
                    <circle class="progress-ring__circle" r="140" cx="160" cy="160" id="progress-circle"></circle>
                </svg>
                <div class="time-display" id="time-display">25:00</div>
            </div>

            <div class="controls">
                <div class="control-btn-wrapper">
                    <button class="control-btn" id="start-btn">▶</button>
                    <span class="control-label">START</span>
                </div>
                <div class="control-btn-wrapper">
                    <button class="control-btn" id="pause-btn">⏸</button>
                    <span class="control-label">PAUSE</span>
                </div>
                <div class="control-btn-wrapper">
                    <button class="control-btn" id="reset-btn">↺</button>
                    <span class="control-label">RESET</span>
                </div>
            </div>
        </section>

        <section class="right-panel">
            <div class="audio-list">
                <button class="audio-btn" onclick="toggleAudio('nature', this)">
                    <span class="audio-icon">🌲</span> <span data-i18n="audioNature">Environment White Noise</span>
                </button>
                <button class="audio-btn" onclick="toggleAudio('lofi', this)">
                    <span class="audio-icon">🎧</span> <span data-i18n="audioLofi">Lofi Music</span>
                </button>
                <button class="audio-btn" onclick="toggleAudio('ocean', this)">
                    <span class="audio-icon">🌊</span> <span data-i18n="audioOcean">Woodpecker</span>
                </button>
            </div>

            <div class="player-controls" id="player-controls">
                <div class="now-playing-text" id="now-playing-title"></div>
                
                <div class="slider-group">
                    <label data-i18n="musicProgress">進度</label>
                    <input type="range" id="music-progress" value="0" min="0" max="100" step="0.1">
                </div>
                
                <div class="slider-group">
                    <label data-i18n="musicVolume">音量</label>
                    <input type="range" id="volume-control" value="50" min="0" max="100" step="1">
                </div>
            </div>
        </section>

    </main>

    <audio id="bg-audio" loop></audio>

    <script>
        const i18n = {
            zh: {
                levelPrefix: "等級",
                mode25: "25 / 5 分鐘",
                mode50: "50 / 10 分鐘",
                phaseWork: "專注時間",
                phaseRest: "休息時間",
                audioNature: "環境白噪音",
                audioLofi: "Lofi 音樂",
                audioOcean: "啄木鳥",
                musicProgress: "進度",
                musicVolume: "音量"
            },
            en: {
                levelPrefix: "Focus Level",
                mode25: "25 / 5 Min",
                mode50: "50 / 10 Min",
                phaseWork: "Focus Time",
                phaseRest: "Break Time",
                audioNature: "Nature Sounds",
                audioLofi: "Lofi Music",
                audioOcean: "Woodpecker",
                musicProgress: "Progress",
                musicVolume: "Volume"
            }
        };
        let currentLang = 'zh';

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = i18n[lang][key];
            });
            updateXPDisplay();
            phaseText.textContent = isWorkPhase ? i18n[lang].phaseWork : i18n[lang].phaseRest;
            
            // 更新播放標題
            if (currentPlayingBtn) {
                const trackName = currentPlayingBtn.querySelector('[data-i18n]').textContent;
                document.getElementById('now-playing-title').textContent = trackName;
            }
        }

        // 經驗值系統
        let currentLevel = 1;
        let currentXP = 0;
        const levelText = document.getElementById('level-text');
        const xpBar = document.getElementById('xp-bar');
        
        function getRequiredXP(level) { return level * 100; }

        function updateXPDisplay() {
            const requiredXP = getRequiredXP(currentLevel);
            levelText.textContent = `${i18n[currentLang].levelPrefix}: ${currentLevel} (${currentXP}/${requiredXP} XP)`;
            const percent = (currentXP / requiredXP) * 100;
            xpBar.style.width = `${percent}%`;
        }

        function gainXP(amount) {
            currentXP += amount;
            let requiredXP = getRequiredXP(currentLevel);
            while (currentXP >= requiredXP) {
                currentXP -= requiredXP;
                currentLevel++;
                requiredXP = getRequiredXP(currentLevel);
            }
            updateXPDisplay();
        }

        // 計時器邏輯
        let timerMode = '25';
        let isWorkPhase = true; 
        let workDuration = 5; // 測試時可調小
        let restDuration = 5;
        let xpReward = 150;
        let timeLeft = workDuration;
        let timerId = null;
        let phaseTimeout = null; 
        let isRunning = false;

        const timeDisplay = document.getElementById('time-display');
        const phaseText = document.getElementById('phase-text');
        const centerPanel = document.getElementById('center-panel');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const circle = document.getElementById('progress-circle');

        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            if (percent === 100) {
                circle.style.transition = 'none';
                circle.style.strokeDashoffset = offset;
                circle.getBoundingClientRect(); 
            } else {
                circle.style.transition = 'stroke-dashoffset 1s linear, stroke 0.5s ease';
                circle.style.strokeDashoffset = offset;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timeDisplay.textContent = formatTime(timeLeft);
            const totalDuration = isWorkPhase ? workDuration : restDuration;
            const percent = (timeLeft / totalDuration) * 100;
            setProgress(percent);
            
            // 🌟 加入這行：每次時間更新，順便檢查貓咪要不要變身
            updateCatState(); 
        }
        

        function setMode(mode, btnElement) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            timerMode = mode;
            if (mode === '25') {
                workDuration = 5;
                restDuration = 5;
                xpReward = 150;
            } else {
                workDuration = 50 * 60;
                restDuration = 10 * 60;
                xpReward = 500;
            }
            resetTimer();
        }

        function switchPhase() {
            if (isWorkPhase) {
                gainXP(xpReward);
                isWorkPhase = false;
                timeLeft = restDuration;
                phaseText.textContent = i18n[currentLang].phaseRest;
                centerPanel.classList.add('rest-mode');
            } else {
                isWorkPhase = true;
                timeLeft = workDuration;
                phaseText.textContent = i18n[currentLang].phaseWork;
                centerPanel.classList.remove('rest-mode');
            }
            updateTimerDisplay();
        }

        function tick() {
            if (timeLeft <= 0) return;
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerId);
                phaseTimeout = setTimeout(() => {
                    if (isRunning) {
                        isRunning = false;
                        switchPhase();
                        startTimer();
                    }
                }, 1000);
            }
        }

        function startTimer() {
    if (!isRunning && timeLeft > 0) {
        isRunning = true;
        
        if (progressWrapper) progressWrapper.style.transition = '--progress 1s linear';

        if (isFocusMode) {
            // ... 這裡是你原本控制貓咪或文字的邏輯 ...
        } else {
            // ... 這裡是你原本控制貓咪或文字的邏輯 ...
        }

        // 🌟 關鍵修復：必須先建立計時器，再執行第一次 tick 🌟
        timerId = setInterval(tick, 1000);
        tick(); 
    }
}

        function pauseTimer() {
            clearInterval(timerId);
            clearTimeout(phaseTimeout); 
            isRunning = false;
            if (timeLeft <= 0) switchPhase();
        }

        function resetTimer() {
            clearInterval(timerId);
            clearTimeout(phaseTimeout);
            isRunning = false;
            isWorkPhase = true;
            timeLeft = workDuration;
            phaseText.textContent = i18n[currentLang].phaseWork;
            centerPanel.classList.remove('rest-mode');
            updateTimerDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateXPDisplay();
        updateTimerDisplay();

        // === 音樂播放與控制邏輯 ===
        const audioPlayer = document.getElementById('bg-audio');
        const playerControls = document.getElementById('player-controls');
        const nowPlayingTitle = document.getElementById('now-playing-title');
        const musicProgress = document.getElementById('music-progress');
        const volumeControl = document.getElementById('volume-control');
        
        let currentPlaying = null;
        let currentPlayingBtn = null;
        let isDraggingProgress = false;
        
        const audioSources = {
            'nature': 'https://ryanlee521123-beep.github.io/vscode/websiteDesign/music/%E4%BB%A4%E4%BA%BA%E6%94%BE%E9%AC%86%E7%9A%84%E6%B5%B7%E6%B5%AA%E8%81%B2.mp3',
            'lofi': 'https://ryanlee521123-beep.github.io/vscode/websiteDesign/music/15%20min%20power%20nap%20%20lofi%20sleep%20to%20recharge%20%20alarm.mp3',
            'ocean': 'https://ryanlee521123-beep.github.io/vscode/websiteDesign/music/Woodpecker.mp3' 
        };

        // 初始化音量
        audioPlayer.volume = volumeControl.value / 100;

        function toggleAudio(type, btnElement) {
            if (currentPlaying === type) {
                audioPlayer.pause();
                btnElement.classList.remove('active');
                currentPlaying = null;
                currentPlayingBtn = null;
                playerControls.style.display = 'none';
                return;
            }
            
            document.querySelectorAll('.audio-btn').forEach(btn => btn.classList.remove('active'));
            audioPlayer.src = audioSources[type];
            audioPlayer.play();
            
            btnElement.classList.add('active');
            currentPlaying = type;
            currentPlayingBtn = btnElement;
            
            // 顯示面板並更新標題
            playerControls.style.display = 'flex';
            const trackName = btnElement.querySelector('[data-i18n]').textContent;
            nowPlayingTitle.textContent = trackName;
        }

        // 更新音樂進度條
        audioPlayer.addEventListener('timeupdate', () => {
            if (!isDraggingProgress && audioPlayer.duration) {
                const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                musicProgress.value = percent;
            }
        });

        // 拖曳音樂進度條
        musicProgress.addEventListener('mousedown', () => isDraggingProgress = true);
        musicProgress.addEventListener('mouseup', () => isDraggingProgress = false);
        musicProgress.addEventListener('input', (e) => {
            if (audioPlayer.duration) {
                const seekTime = (e.target.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = seekTime;
            }
        });

        // 調整音量
        volumeControl.addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value / 100;
        });

        changeLanguage(currentLang);

        // === 🌟 新增：深淺色主題切換邏輯 ===
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('theme-switch');
            
            if (body.getAttribute('data-theme') === 'light') {
                // 切換回深色
                body.removeAttribute('data-theme');
                themeBtn.textContent = '☀️';
            } else {
                // 切換為淺色
                body.setAttribute('data-theme', 'light');
                themeBtn.textContent = '🌙';
            }
        }

        // === 🌟 新增：更新貓咪狀態邏輯 ===
        // === 🌟 更新貓咪狀態邏輯 (加入復活機制) ===
        function updateCatState() {
            const petSprite = document.getElementById('pet-sprite');
            if (!petSprite) return;

            // 如果貓咪正在「爬起來」，先不要打斷牠的動作
            if (petSprite.classList.contains('cat-revive')) return;

            let newState = '';
            
            if (!isWorkPhase) {
                newState = 'cat-die';
            } else {
                // 🌟 關鍵：如果本來是死掉的，現在要開始專注了，先觸發「爬起來」動畫
                if (petSprite.classList.contains('cat-die')) {
                    petSprite.className = 'pixel-cat cat-revive';
                    
                    // 等待 0.8 秒 (剛好是動畫播完的時間)，再次呼叫更新，切換回正常狀態
                    setTimeout(() => {
                        petSprite.classList.remove('cat-revive');
                        updateCatState();
                    }, 800);
                    return; // 直接結束這次函數，等 0.8 秒後再說
                }

                // 正常的專注狀態判斷
                if (timeLeft <= 5 * 60) {
                    newState = 'cat-run';
                } else {
                    newState = 'cat-idle';
                }
            }

            // 如果狀態有改變，才執行換圖
            if (!petSprite.classList.contains(newState)) {
                petSprite.className = `pixel-cat ${newState}`;
            }
        }
    </script>
</body>
</html>
