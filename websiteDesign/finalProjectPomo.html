<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoGrowth - 專注力電子雞</title>
    <style>
        /*  讓 CSS 知道 --progress 是一個可以做動畫的百分比 */
        @property --progress {
            syntax: '<percentage>';
            inherits: false;
            initial-value: 0%;
        }

        /* 基礎重置與背景設定 */
        body {
            background-color: #2b3a4a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* ---  新增：排版容器，讓計時器跟播放器左右並排 --- */
        .layout-wrapper {
            display: flex;
            gap: 50px; /* 兩個區塊的間距 */
            align-items: center;
        }

        /* 外層：負責發光邊框與立體陰影 (已幫你換回黃色 #ffd700) */
        .container-wrapper {
            background: conic-gradient(#ffd700 var(--progress, 0%), transparent 0%);
            padding: 4px; 
            border-radius: 36px; 
            box-shadow: 15px 15px 30px #1a232c, 
                       -15px -15px 30px #3c5168;
            width: 350px;
            transition: --progress 1s linear; 
        }

        /* 主容器 */
        .container {
            text-align: center;
            background: #2b3a4a;
            padding: 40px 46px; 
            border-radius: 36px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #a3c2c2;
            margin-bottom: 30px;
        }

        /* 等級與經驗值系統 */
        .level-container {
            text-align: left;
            margin-bottom: 20px;
        }

        #level-text {
            font-size: 0.85rem;
            color: #88c0d0;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .progress-bar-bg {
            background: #1e2936;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            box-shadow: inset 3px 3px 6px #151d26, 
                        inset -3px -3px 6px #273546;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: #88c0d0;
            height: 100%;
            width: 0%; 
            border-radius: 10px;
            transition: width 0.5s ease-out; 
            box-shadow: 0 0 8px rgba(136, 192, 208, 0.6); 
        }

        /* 寵物展示區 */
        .pet-container {
            margin: 20px 0;
            min-height: 150px;
        }

        #pet {
            font-size: 6rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .pet-focus {
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #pet-status {
            font-size: 0.9rem;
            color: #8fa6b8;
            margin-top: 10px;
        }

        /* 計時器顯示 */
        #time-display {
            font-size: 4.5rem;
            font-weight: bold;
            color: #88c0d0;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        /* 按鈕設計 */
        .controls {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }

        button {
            background: #2b3a4a;
            color: #e0e0e0;
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 8px 8px 16px #1a232c, 
                       -8px -8px 16px #3c5168;
            transition: all 0.2s ease;
        }

        button:active {
            box-shadow: inset 8px 8px 16px #1a232c, 
                       inset -8px -8px 16px #3c5168;
            color: #88c0d0;
        }

        /* --- 🌟 新增：音樂播放器樣式 --- */
        .music-player {
            background: #2b3a4a;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 15px 15px 30px #1a232c, 
                       -15px -15px 30px #3c5168;
            width: 200px;
            text-align: center;
        }

        .music-btn {
            background: #2b3a4a;
            color: #88c0d0;
            border: none;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 5px 5px 10px #1a232c, 
                       -5px -5px 10px #3c5168;
            transition: all 0.2s ease;
            width: 100%;
            font-size: 0.95rem;
            font-weight: bold;
            display: block; /* 讓按鈕垂直排列 */
        }

        .music-btn:active {
            box-shadow: inset 5px 5px 10px #1a232c, 
                       inset -5px -5px 10px #3c5168;
        }

        .stop-btn {
            color: #e07a5f; 
            margin-top: 10px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="layout-wrapper">
        
        <div class="container-wrapper" id="progress-wrapper">
            <div class="container">
                <h1>🌱 PomoGrowth</h1>
                
                <div class="level-container">
                    <div id="level-text">Pomo-chan's Focus Level: 1 (0/100 XP)</div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="xp-bar"></div>
                    </div>
                </div>

                <div class="pet-container">
                    <div id="pet">🥚</div> 
                    <p id="pet-status">等待專注中...</p>
                </div>

                <div id="time-display">00:10</div>

                <div class="controls">
                    <button id="start-btn">開始專注</button>
                    <button id="reset-btn">重置</button>
                </div>
            </div>
        </div> 

        <div class="music-player">
            <h3 style="color: #a3c2c2; margin-top: 0; margin-bottom: 20px;">🎧 專注白噪音</h3>
            
            <audio id="bg-audio" loop></audio>
            
            <button class="music-btn" onclick="toggleAudio('lofi')">☕ Lofi (播放/暫停)</button>
            <button class="music-btn" onclick="toggleAudio('rain')">🌧️ 雨聲 (播放/暫停)</button>
            <button class="music-btn" onclick="toggleAudio('fire')">🔥 柴火 (播放/暫停)</button>
            
            <button class="music-btn stop-btn" onclick="stopAudio()">⏹️ 完全停止</button>
        </div>

    </div> <script>
        let timer;
        let timeLeft = 10; 
        let isRunning = false;
        let isFocusMode = true; 

        let level = 1;
        let currentXP = 0;
        const xpRewardPerSession = 25; 

        function getXpNeeded(currentLevel) {
            return 100 + (currentLevel - 1) * 50; 
        }

        const timeDisplay = document.getElementById('time-display');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const pet = document.getElementById('pet');
        const petStatus = document.getElementById('pet-status');
        const levelText = document.getElementById('level-text');
        const xpBar = document.getElementById('xp-bar');
        const progressWrapper = document.getElementById('progress-wrapper'); 

        // --- 🌟 修改：音樂播放控制邏輯 (加入暫停/繼續功能) ---

        const bgAudio = document.getElementById('bg-audio');
        let currentTrack = ''; // 新增一個變數，用來記住現在正在播哪首歌

        // 換成更穩定的音檔連結
        const audioSources = {
            'lofi': 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3', 
            'rain': 'https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg', // Google 官方開源雨聲
            'fire': 'https://actions.google.com/sounds/v1/emergency/fireplace_with_crackling_sounds.ogg' // Google 官方開源柴火聲
        };

        // 播放/暫停 切換功能
        function toggleAudio(type) {
            if (currentTrack === type) {
                // 如果點擊的是同一首歌
                if (bgAudio.paused) {
                    bgAudio.play(); // 從剛才暫停的地方繼續播
                } else {
                    bgAudio.pause(); // 暫停
                }
            } else {
                // 如果點擊的是另一首新歌
                currentTrack = type;
                bgAudio.src = audioSources[type];
                bgAudio.play();
            }
        }

        // 完全停止並歸零
        function stopAudio() {
            bgAudio.pause();
            bgAudio.currentTime = 0; 
            currentTrack = ''; // 把記憶清空
        }
        // ------------------------

        function resetProgressBarInstantly() {
            if (progressWrapper) {
                progressWrapper.style.transition = 'none'; 
                progressWrapper.style.setProperty('--progress', `100%`); 
                
                setTimeout(() => {
                    progressWrapper.style.transition = '--progress 1s linear';
                }, 50);
            }
        }

        function updateLevelDisplay() {
            const neededXP = getXpNeeded(level); 
            levelText.textContent = `Pomo-chan's Focus Level: ${level} (${currentXP}/${neededXP} XP)`;
            const progressPercent = (currentXP / neededXP) * 100;
            xpBar.style.width = `${progressPercent}%`;
        }

        function gainXP(amount) {
            currentXP += amount;
            while (currentXP >= getXpNeeded(level)) {
                currentXP -= getXpNeeded(level); 
                level++; 
            }
            updateLevelDisplay();
        }

        function updateDisplay() {
            const safeTime = Math.max(0, timeLeft);
            const minutes = Math.floor(safeTime / 60);
            const seconds = safeTime % 60;
            timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timer);
                isRunning = false;
                startBtn.textContent = '繼續';
                pet.classList.remove('pet-focus');
                petStatus.textContent = '計時已暫停';
                
                if (progressWrapper) progressWrapper.style.transition = 'none';
            } else {
                isRunning = true;
                startBtn.textContent = '暫停';
                
                if (progressWrapper) progressWrapper.style.transition = '--progress 1s linear';

                if (isFocusMode) {
                    pet.textContent = '📚'; 
                    pet.classList.add('pet-focus'); 
                    petStatus.textContent = '小怪獸陪你一起專注中！';
                } else {
                    pet.textContent = '💤'; 
                    pet.classList.remove('pet-focus');
                    petStatus.textContent = '休息中...';
                }

                timer = setInterval(() => {
                    if (timeLeft <= 0) {
                        isFocusMode = !isFocusMode; 
                        
                        if (isFocusMode) {
                            timeLeft = 10; 
                            pet.textContent = '📚';
                            pet.classList.add('pet-focus');
                            petStatus.textContent = '休息結束，自動開始專注！';
                        } else {
                            gainXP(xpRewardPerSession); 
                            timeLeft = 5; 
                            pet.textContent = '💤';
                            pet.classList.remove('pet-focus');
                            petStatus.textContent = '太棒了！獲得 25 XP，眼睛休息一下吧。';
                        }
                        resetProgressBarInstantly(); 
                    } else {
                        timeLeft--;
                    }

                    updateDisplay();

                    if (progressWrapper && timeLeft >= 0) {
                        const totalTime = isFocusMode ? 10 : 5; 
                        const percent = (timeLeft / totalTime) * 100;
                        progressWrapper.style.setProperty('--progress', `${percent}%`);
                    }                  
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timer); 
            isRunning = false;    
            isFocusMode = true;   
            timeLeft = 10;        
            updateDisplay();      
            
            resetProgressBarInstantly();
            
            startBtn.textContent = '開始專注'; 
            pet.textContent = '🥚';
            pet.classList.remove('pet-focus');
            petStatus.textContent = '等待專注中...';
        }

        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
        updateLevelDisplay();
        
        if (progressWrapper) progressWrapper.style.setProperty('--progress', `100%`);
    </script>
</body>
</html>
