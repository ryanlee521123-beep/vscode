<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoGrowth - 番茄鐘電子雞</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1e2638;
            --panel-bg: #232c3f;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --accent-cyan: #8be9fd;
            --accent-green: #50fa7b;
            --shadow-dark: #151a27;
            --shadow-light: #2b364d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at top right, #33415c 0%, var(--bg-color) 40%, #151b29 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 頂部 Logo */
        header {
            padding: 30px 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* 主要排版區塊 */
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            flex-grow: 1;
            padding: 0 50px;
        }

        /* === 左側：角色與等級區塊 === */
        .left-panel {
            display: flex;
            flex-direction: column;
            width: 300px;
        }

        .level-info {
            margin-bottom: 20px;
        }

        .level-text {
            font-size: 0.95rem;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        .xp-bar-bg {
            background-color: var(--shadow-dark);
            height: 12px;
            border-radius: 10px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5), inset -2px -2px 5px rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .xp-bar-fill {
            height: 100%;
            width: 0%; 
            background-color: var(--accent-cyan);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.5s ease;
        }

        .character-container {
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .character-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* === 中間：圓形計時器與按鈕 === */
        .center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* 模式切換按鈕 */
        .mode-selector {
            display: flex;
            gap: 15px;
            background: var(--shadow-dark);
            padding: 8px;
            border-radius: 20px;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4), inset -3px -3px 6px rgba(255,255,255,0.05);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: var(--panel-bg);
            color: var(--text-main);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .phase-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            margin: 0;
            transition: color 0.3s ease;
        }

        .timer-container {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: var(--bg-color);
            box-shadow: 
                20px 20px 40px var(--shadow-dark), 
                -20px -20px 40px var(--shadow-light);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg); 
        }

        .progress-ring__circle-bg {
            fill: transparent;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 12;
        }

        .progress-ring__circle {
            fill: transparent;
            stroke: var(--accent-cyan);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 942; 
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        /* 休息時的顏色樣式 */
        .rest-mode .progress-ring__circle {
            stroke: var(--accent-green);
            filter: drop-shadow(0 0 8px var(--accent-green));
        }
        .rest-mode .time-display, .rest-mode .phase-text {
            color: var(--accent-green);
            text-shadow: 0 0 15px rgba(80, 250, 123, 0.5);
        }

        .time-display {
            font-family: 'VT323', monospace;
            font-size: 6rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(139, 233, 253, 0.5);
            z-index: 2;
            transition: color 0.5s ease;
        }

        .controls {
            display: flex;
            gap: 25px;
            margin-top: 10px;
        }

        .control-btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--panel-bg);
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .control-btn:active {
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            color: var(--accent-cyan);
        }

        .control-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* === 右側：白噪音音樂清單 === */
        .right-panel {
            width: 280px;
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
        }

        .audio-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .audio-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-color);
            border: none;
            color: var(--text-dim);
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px rgba(255,255,255,0.02);
            transition: all 0.3s ease;
        }

        .audio-btn:hover {
            color: var(--text-main);
        }

        .audio-btn.active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px rgba(255,255,255,0.02);
            color: var(--accent-cyan);
            border: 1px solid rgba(139, 233, 253, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <div style="background: #2b364d; padding: 8px; border-radius: 12px; display: flex;">👾</div>
        <span>PomoGrowth</span>
    </header>

    <main class="main-layout">
        
        <section class="left-panel">
            <div class="level-info">
                <div class="level-text" id="level-text">Level: 1 (0/100 XP)</div>
                <div class="xp-bar-bg">
                    <div class="xp-bar-fill" id="xp-bar"></div>
                </div>
            </div>
            
            <div class="character-container">
                <img class="character-img" id="pet-image" src="https://cdn-icons-png.flaticon.com/512/826/826963.png" alt="My Pet">
            </div>
        </section>

        <section class="center-panel" id="center-panel">
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="25" onclick="setMode('25', this)">25 / 5 分鐘</button>
                <button class="mode-btn" data-mode="50" onclick="setMode('50', this)">50 / 10 分鐘</button>
            </div>

            <p class="phase-text" id="phase-text">🧠 專注時間</p>

            <div class="timer-container">
                <svg class="progress-ring" width="320" height="320">
                    <circle class="progress-ring__circle-bg" r="150" cx="160" cy="160"></circle>
                    <circle class="progress-ring__circle" r="150" cx="160" cy="160" id="progress-circle"></circle>
                </svg>
                <div class="time-display" id="time-display">25:00</div>
            </div>

            <div class="controls">
                <div class="control-btn-wrapper">
                    <button class="control-btn" id="start-btn">▶</button>
                    <span class="control-label">START</span>
                </div>
                <div class="control-btn-wrapper">
                    <button class="control-btn" id="pause-btn">⏸</button>
                    <span class="control-label">PAUSE</span>
                </div>
                <div class="control-btn-wrapper">
                    <button class="control-btn" id="reset-btn">↺</button>
                    <span class="control-label">RESET</span>
                </div>
            </div>
        </section>

        <section class="right-panel">
            <div class="audio-list">
                <button class="audio-btn" onclick="toggleAudio('nature', this)">
                    <span class="audio-icon">🌲</span> Nature Sounds
                </button>
                <button class="audio-btn" onclick="toggleAudio('lofi', this)">
                    <span class="audio-icon">🎧</span> Lofi Music
                </button>
                <button class="audio-btn" onclick="toggleAudio('ocean', this)">
                    <span class="audio-icon">🌊</span> Ocean Waves
                </button>
            </div>
        </section>

    </main>

    <audio id="bg-audio" loop></audio>

    <script>
        // === 經驗值系統邏輯 ===
        let currentLevel = 1;
        let currentXP = 0;
        
        const levelText = document.getElementById('level-text');
        const xpBar = document.getElementById('xp-bar');
        
        function getRequiredXP(level) {
            return level * 100; // 第一級100，第二級200，呈現線性
        }

        function updateXPDisplay() {
            const requiredXP = getRequiredXP(currentLevel);
            levelText.textContent = `Focus Level: ${currentLevel} (${currentXP}/${requiredXP} XP)`;
            const percent = (currentXP / requiredXP) * 100;
            xpBar.style.width = `${percent}%`;
        }

        function gainXP(amount) {
            currentXP += amount;
            let requiredXP = getRequiredXP(currentLevel);
            
            // 處理升級邏輯 (可能一次加太多連升兩級)
            while (currentXP >= requiredXP) {
                currentXP -= requiredXP;
                currentLevel++;
                requiredXP = getRequiredXP(currentLevel);
            }
            updateXPDisplay();
        }

        // === 計時器與模式邏輯 ===
        let timerMode = '25'; // '25' 或 '50'
        let isWorkPhase = true; // true: 專注, false: 休息
        
        let workDuration = 25 * 60;
        let restDuration = 5 * 60;
        let xpReward = 25;

        let timeLeft = workDuration;
        let timerId = null;
        let phaseTimeout = null; // 新增：用來處理階段切換的 1 秒延遲
        let isRunning = false;

        const timeDisplay = document.getElementById('time-display');
        const phaseText = document.getElementById('phase-text');
        const centerPanel = document.getElementById('center-panel');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const circle = document.getElementById('progress-circle');

        // SVG 進度圈設定
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            
            if (percent === 100) {
                circle.style.transition = 'none';
                circle.style.strokeDashoffset = offset;
                // 強制瀏覽器重繪，確保回到 100% 時是瞬間填滿，不會跟倒數動畫混在一起
                circle.getBoundingClientRect(); 
            } else {
                circle.style.transition = 'stroke-dashoffset 1s linear, stroke 0.5s ease';
                circle.style.strokeDashoffset = offset;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timeDisplay.textContent = formatTime(timeLeft);
            const totalDuration = isWorkPhase ? workDuration : restDuration;
            const percent = (timeLeft / totalDuration) * 100;
            setProgress(percent);
        }

        // 切換模式 (25/5 或 50/10)
        function setMode(mode, btnElement) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            timerMode = mode;
            if (mode === '25') {
                workDuration = 5; //記得調25 * 60
                restDuration = 5; //25 * 60
                xpReward = 25;
            } else {
                workDuration = 50 * 60;
                restDuration = 10 * 60;
                xpReward = 50;
            }
            resetTimer();
        }

        // 切換階段 (專注 <-> 休息)
        function switchPhase() {
            if (isWorkPhase) {
                gainXP(xpReward);
                isWorkPhase = false;
                timeLeft = restDuration;
                phaseText.textContent = '☕ 休息時間';
                centerPanel.classList.add('rest-mode');
            } else {
                isWorkPhase = true;
                timeLeft = workDuration;
                phaseText.textContent = '🧠 專注時間';
                centerPanel.classList.remove('rest-mode');
            }
            updateTimerDisplay();
        }

        // 🌟 核心倒數邏輯 (將原本寫在 start 裡的東西獨立出來)
        function tick() {
            if (timeLeft <= 0) return; // 防呆保護

            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                clearInterval(timerId);

                // 等待 1 秒，讓 00:00 的進度條完整歸零
                phaseTimeout = setTimeout(() => {
                    if (isRunning) {
                        isRunning = false; // 關鍵修復：解除執行狀態，讓下個階段可以順利觸發
                        switchPhase();
                        startTimer(); // 自動開始下一階段
                    }
                }, 1000);
            }
        }

        function startTimer() {
            if (!isRunning && timeLeft > 0) {
                isRunning = true;
                
                // 關鍵修復：按下的瞬間立刻執行一次 tick，讓數字和進度條馬上開始動！
                tick(); 
                
                // 接著才開始每秒重複
                timerId = setInterval(tick, 1000);
            }
        }

        function pauseTimer() {
            clearInterval(timerId);
            clearTimeout(phaseTimeout); // 如果在 00:00 的延遲期間按下暫停，也要一併取消
            isRunning = false;

            // 如果剛好在 00:00 時按下暫停，直接切換階段並保持暫停
            if (timeLeft <= 0) {
                switchPhase();
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            clearTimeout(phaseTimeout);
            isRunning = false;
            isWorkPhase = true;
            timeLeft = workDuration;
            phaseText.textContent = '🧠 專注時間';
            centerPanel.classList.remove('rest-mode');
            updateTimerDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // 初始化
        updateXPDisplay();
        updateTimerDisplay();


        // === 音樂播放邏輯 ===
        const audioPlayer = document.getElementById('bg-audio');
        let currentPlaying = null;
        
        // 你的音樂連結
        const audioSources = {
            'nature': 'https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=birds-in-the-forest-12051.mp3',
            'lofi': 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3',
            'ocean': 'https://cdn.pixabay.com/download/audio/2021/08/09/audio_8241fc95df.mp3?filename=light-rain-109591.mp3' 
        };

        function toggleAudio(type, btnElement) {
            if (currentPlaying === type) {
                audioPlayer.pause();
                btnElement.classList.remove('active');
                currentPlaying = null;
                return;
            }
            document.querySelectorAll('.audio-btn').forEach(btn => btn.classList.remove('active'));
            audioPlayer.src = audioSources[type];
            audioPlayer.play();
            btnElement.classList.add('active');
            currentPlaying = type;
        }
    </script>
</body>
</html>
