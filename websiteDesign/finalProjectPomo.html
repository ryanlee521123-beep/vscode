<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomoGrowth - 像素風專注力電子雞</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        /* 🌟 定義動畫進度變數 */
        @property --progress {
            syntax: '<percentage>';
            inherits: false;
            initial-value: 100%;
        }

        /* 🌟 基礎與背景設定：深邃星空藍 */
        body {
            background-color: #171c26; /* 更深的底色 */
            color: #e0e0e0;
            font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 85% 15%, #2a3546 0%, transparent 40%); /* 模擬右上角的光暈 */
        }

        /* 🌟 主排版：三欄式 Grid */
        .main-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px; /* 三個區塊的間距 */
        }

        /* ================= 左側：等級與寵物 ================= */
        .left-panel {
            display: flex;
            flex-direction: column;
            width: 280px;
        }

        #level-text {
            font-size: 0.9rem;
            color: #d8dee9;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .progress-bar-bg {
            background: #0f141d;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            box-shadow: inset 2px 2px 5px #05070a, inset -2px -2px 5px #1f2736;
            margin-bottom: 40px;
        }

        .progress-bar-fill {
            background: #88c0d0;
            height: 100%;
            width: 0%; 
            border-radius: 10px;
            transition: width 0.5s ease-out; 
            box-shadow: 0 0 10px #88c0d0; 
        }

        .pet-container {
            text-align: center;
            /* 這裡未來可以放你的像素圖，現在先用 Emoji 代替並加上光暈 */
            filter: drop-shadow(0 0 20px rgba(136, 192, 208, 0.3));
        }

        #pet {
            font-size: 8rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .pet-focus {
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #pet-status {
            font-size: 1rem;
            color: #8fa6b8;
            margin-top: 20px;
            font-weight: 800;
        }

        /* ================= 中間：發光圓環計時器與控制按鈕 ================= */
        .center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        /* 發光圓環外層 (負責漸層與邊框) */
        .timer-ring-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            /* 使用藍色漸層，從頂部開始 */
            background: conic-gradient(#88c0d0 var(--progress, 100%), #1f2736 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(136, 192, 208, 0.4), 
                       -10px -10px 20px rgba(42, 53, 70, 0.5), 
                       10px 10px 20px rgba(10, 15, 22, 0.5); /* 新擬態外層陰影 */
            transition: --progress 1s linear; 
        }

        /* 內層圓形 (負責挖空中心，呈現環狀) */
        .timer-inner-circle {
            width: 290px; /* 比外層小，形成 15px 的粗細 */
            height: 290px;
            border-radius: 50%;
            background-color: #171c26; /* 配合背景色 */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 8px 8px 15px rgba(10, 15, 22, 0.8), 
                        inset -8px -8px 15px rgba(42, 53, 70, 0.6); /* 內部凹陷陰影 */
        }

        #time-display {
            font-family: 'VT323', monospace; /* 像素字體 */
            font-size: 6.5rem;
            color: #e5e9f0;
            text-shadow: 0 0 15px rgba(136, 192, 208, 0.8);
            letter-spacing: 5px;
        }

        /* 控制按鈕區 */
        .controls {
            display: flex;
            gap: 25px;
        }

        .control-btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            background: #1e2634;
            color: #88c0d0;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 18px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 6px 6px 12px #0f141d, 
                       -6px -6px 12px #293447;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-btn:active {
            box-shadow: inset 4px 4px 8px #0f141d, 
                       inset -4px -4px 8px #293447;
            color: #5e81ac;
        }

        .btn-label {
            font-size: 0.8rem;
            color: #8fa6b8;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* ================= 右側：音樂播放器 ================= */
        .right-panel {
            background: #1b2230;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 10px 10px 20px #0e121a, 
                       -10px -10px 20px #283246;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .music-btn {
            background: #1b2230;
            color: #d8dee9;
            border: none;
            padding: 15px 20px;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 5px 5px 10px #0e121a, 
                       -5px -5px 10px #283246;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 15px; /* 圖示與文字的距離 */
            text-align: left;
        }

        .music-btn:active, .music-btn.playing {
            box-shadow: inset 4px 4px 8px #0e121a, 
                       inset -4px -4px 8px #283246;
            color: #88c0d0;
        }

        .stop-btn {
            color: #bf616a; 
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <div class="left-panel">
            <div id="level-text">Pomo-chan's Focus Level: 1 (0/100 XP)</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="xp-bar"></div>
            </div>
            <div class="pet-container">
                <div id="pet">🦖</div> 
                <p id="pet-status">等待專注中...</p>
            </div>
        </div>

        <div class="center-panel">
            
            <div class="timer-ring-wrapper" id="progress-wrapper">
                <div class="timer-inner-circle">
                    <div id="time-display">00:10</div>
                </div>
            </div>

            <div class="controls">
                <div class="control-btn-wrapper">
                    <button class="icon-btn" id="start-btn">▶</button>
                    <span class="btn-label">START</span>
                </div>
                <div class="control-btn-wrapper">
                    <button class="icon-btn" id="pause-btn">⏸</button>
                    <span class="btn-label">PAUSE</span>
                </div>
                <div class="control-btn-wrapper">
                    <button class="icon-btn" id="reset-btn">↺</button>
                    <span class="btn-label">RESET</span>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <audio id="bg-audio" loop></audio>
            
            <button class="music-btn" onclick="toggleAudio('lofi', this)">
                <span style="font-size: 1.2rem;">🎧</span> Lofi Music
            </button>
            <button class="music-btn" onclick="toggleAudio('rain', this)">
                <span style="font-size: 1.2rem;">🌧️</span> Rain Sounds
            </button>
            <button class="music-btn" onclick="toggleAudio('fire', this)">
                <span style="font-size: 1.2rem;">🔥</span> Fireplace
            </button>
            
            <button class="music-btn stop-btn" onclick="stopAudio()">⏹️ Stop All</button>
        </div>

    </div>

    <script>
        // --- 計時器變數 ---
        let timer;
        let timeLeft = 10; // 測試用 10 秒
        let isRunning = false;
        let isFocusMode = true; 

        // --- 經驗值變數 ---
        let level = 1;
        let currentXP = 0;
        const xpRewardPerSession = 25; 

        function getXpNeeded(currentLevel) {
            return 100 + (currentLevel - 1) * 50; 
        }

        // --- 取得 DOM 元素 ---
        const timeDisplay = document.getElementById('time-display');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn'); // 新增暫停按鈕
        const resetBtn = document.getElementById('reset-btn');
        const pet = document.getElementById('pet');
        const petStatus = document.getElementById('pet-status');
        const levelText = document.getElementById('level-text');
        const xpBar = document.getElementById('xp-bar');
        const progressWrapper = document.getElementById('progress-wrapper'); 

        // --- 音樂邏輯 ---
        const bgAudio = document.getElementById('bg-audio');
        let currentTrack = '';
        const audioSources = {
            'lofi': 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3', 
            'rain': 'https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg',
            'fire': 'https://www.soundjay.com/nature/sounds/fire-1.mp3' 
        };

        function toggleAudio(type, btnElement) {
            // 清除其他按鈕的發光樣式
            document.querySelectorAll('.music-btn').forEach(btn => btn.classList.remove('playing'));

            if (currentTrack === type) {
                if (bgAudio.paused) {
                    bgAudio.play();
                    btnElement.classList.add('playing');
                } else {
                    bgAudio.pause();
                }
            } else {
                currentTrack = type;
                bgAudio.src = audioSources[type];
                bgAudio.play();
                btnElement.classList.add('playing');
            }
        }

        function stopAudio() {
            bgAudio.pause();
            bgAudio.currentTime = 0; 
            currentTrack = ''; 
            document.querySelectorAll('.music-btn').forEach(btn => btn.classList.remove('playing'));
        }

        // --- 進度條瞬間歸零防呆 ---
        function resetProgressBarInstantly() {
            if (progressWrapper) {
                progressWrapper.style.transition = 'none'; 
                progressWrapper.style.setProperty('--progress', `100%`); 
                setTimeout(() => {
                    progressWrapper.style.transition = '--progress 1s linear';
                }, 50);
            }
        }

        // --- UI 更新邏輯 ---
        function updateLevelDisplay() {
            const neededXP = getXpNeeded(level); 
            levelText.textContent = `Pomo-chan's Focus Level: ${level} (${currentXP}/${neededXP} XP)`;
            const progressPercent = (currentXP / neededXP) * 100;
            xpBar.style.width = `${progressPercent}%`;
        }

        function gainXP(amount) {
            currentXP += amount;
            while (currentXP >= getXpNeeded(level)) {
                currentXP -= getXpNeeded(level); 
                level++; 
            }
            updateLevelDisplay();
        }

        function updateDisplay() {
            const safeTime = Math.max(0, timeLeft);
            const minutes = Math.floor(safeTime / 60);
            const seconds = safeTime % 60;
            timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // --- 獨立的 START 與 PAUSE 邏輯 ---
        function startTimer() {
            if (isRunning) return; // 如果已經在跑，按 start 沒反應
            isRunning = true;
            
            if (progressWrapper) progressWrapper.style.transition = '--progress 1s linear';

            if (isFocusMode) {
                pet.textContent = '📚'; 
                pet.classList.add('pet-focus'); 
                petStatus.textContent = '小怪獸陪你專注中！';
            } else {
                pet.textContent = '💤'; 
                pet.classList.remove('pet-focus');
                petStatus.textContent = '休息時間...';
            }

            timer = setInterval(() => {
                if (timeLeft <= 0) {
                    isFocusMode = !isFocusMode; 
                    
                    if (isFocusMode) {
                        timeLeft = 10; 
                        pet.textContent = '📚';
                        pet.classList.add('pet-focus');
                        petStatus.textContent = '休息結束，自動開始專注！';
                    } else {
                        gainXP(xpRewardPerSession); 
                        timeLeft = 5; 
                        pet.textContent = '💤';
                        pet.classList.remove('pet-focus');
                        petStatus.textContent = '太棒了！獲得 25 XP。';
                    }
                    resetProgressBarInstantly(); 
                } else {
                    timeLeft--;
                }

                updateDisplay();

                if (progressWrapper && timeLeft >= 0) {
                    const totalTime = isFocusMode ? 10 : 5; 
                    const percent = (timeLeft / totalTime) * 100;
                    progressWrapper.style.setProperty('--progress', `${percent}%`);
                }                  
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return; // 如果已經暫停，按 pause 沒反應
            clearInterval(timer);
            isRunning = false;
            pet.classList.remove('pet-focus');
            petStatus.textContent = '計時已暫停';
            if (progressWrapper) progressWrapper.style.transition = 'none';
        }

        function resetTimer() {
            clearInterval(timer); 
            isRunning = false;    
            isFocusMode = true;   
            timeLeft = 10;        
            updateDisplay();      
            
            resetProgressBarInstantly();
            
            pet.textContent = '🦖';
            pet.classList.remove('pet-focus');
            petStatus.textContent = '等待專注中...';
        }

        // --- 綁定按鈕事件 ---
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // --- 初始化 ---
        updateDisplay();
        updateLevelDisplay();
        if (progressWrapper) progressWrapper.style.setProperty('--progress', `100%`);
    </script>
</body>
</html>
