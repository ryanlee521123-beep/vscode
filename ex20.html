<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning and Table Assignment</title>
    <style>
        body {
            font-family: serif; 
            margin: 50px;
        }

        table {
            border-collapse: collapse; 
            width: 250px;
            text-align: left;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: gray;
            color: white;
            font-weight: bold;
        }

        tr:nth-child(odd) td {
            background-color: yellow;
        }

        tr:nth-child(even) td {
            background-color: white;
        }

        .fixed-box {
            position: fixed;
            top: 50px;      
            right: 50px;    
            width: 120px;
            border: 3px solid #6b8e23; 
            padding: 10px;
            background-color: white; 
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
        </tr>
        <tr>
            <td>1</td>
            <td>1</td>
        </tr>
        <tr>
            <td>2</td>
            <td>2</td>
        </tr>
        <tr>
            <td>3</td>
            <td>3</td>
        </tr>
    </table>

    <div class="fixed-box">
        This div element has position: fixed;
    </div>

</body>
</html>
