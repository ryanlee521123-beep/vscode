<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Interaction Assignment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* --- SPECIFIED BUTTON CSS --- */
        .info-btn {
            height: 22px;              /* size: h22 */
            border-radius: 8px;        /* size: R8 */
            background-color: #ffffff; /* background #ffffff */
            border: 1px solid #2f2f2f; /* outline 1px #2f2f2f */
            color: #2f2f2f;            /* Color : #2f2f2f */
            font-family: 'Roboto', sans-serif; /* Font style: Roboto */
            font-size: 13px;           /* Roboto Regular 13px */
            font-weight: 400;
            padding: 0 18px;           /* 18px spacing on left/right from redlines */
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .info-btn:hover {
            background-color: #f0f0f0;
        }

        /* --- LAYOUT & IMAGE --- */
        .header-area {
            display: flex;
            justify-content: flex-end;
            width: 450px; 
        }

        .image-container {
            width: 450px;
            height: 240px; /* Default 450x240 from mockup */
            background-color: #e0e0e0;
            overflow: hidden;
            position: relative;
        }

        .main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- DETAILED INFO PANEL --- */
        .details-panel {
            display: none; /* Hidden by default */
            width: 450px;
            border: 1px solid #cfddff;
            border-top: none;
            box-sizing: border-box;
        }

        /* Class toggled by JavaScript */
        .details-panel.show {
            display: block; 
        }

        /* Recreating the green table rows from the mockup */
        .detail-row {
            padding: 6px 10px;
            font-size: 12px;
            color: #333;
            border-bottom: 1px solid #fff;
        }

        .detail-row:nth-child(odd) {
            background-color: #b5ebb5; /* Light green */
        }

        .detail-row:nth-child(even) {
            background-color: #8ce48c; /* Darker green */
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header-area">
            <button id="toggleInfoBtn" class="info-btn">查看資訊</button>
        </div>

        <div class="image-container">
            <img src="https://picsum.photos/450/240" alt="Scenery" class="main-img">
        </div>

        <div id="infoPanel" class="details-panel">
            <div class="detail-row">修改日期 : 2017/10/12</div>
            <div class="detail-row">類型 : JPG</div>
            <div class="detail-row">大小 : 466.97KB</div>
            <div class="detail-row">路徑 : \\designcenter.qnap.com.tw\DesignCenter\PM...</div>
        </div>
    </div>

    <script>
        // Grab the button and the panel from the DOM
        const button = document.getElementById('toggleInfoBtn');
        const panel = document.getElementById('infoPanel');

        // Add a click event listener to the button
        button.addEventListener('click', function() {
            // Toggle the 'show' class on the panel to reveal/hide it
            panel.classList.toggle('show');
        });
    </script>

</body>
</html>
